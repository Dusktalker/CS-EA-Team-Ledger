<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Ledger — Clock In / Out</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');

:root {
  --paper: #ECE7D8;
  --paper-raised: #F5F2E7;
  --ink: #2B2420;
  --ink-soft: #6B6255;
  --rule: #C9C2AC;
  --green: #1F4D3E;
  --green-hover: #17392E;
  --rust: #8B3A2F;
  --rust-hover: #6E2C23;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 48px 20px;
}

.book {
  width: 100%;
  max-width: 520px;
  background: var(--paper-raised);
  border: 1px solid var(--rule);
  border-radius: 3px;
  box-shadow: 0 1px 0 var(--rule), 0 12px 32px rgba(43, 36, 32, 0.08);
  overflow: hidden;
}

.book-header {
  padding: 32px 36px 24px;
  border-bottom: 1px solid var(--rule);
}

.book-header h1 {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 28px;
  margin: 0 0 6px;
  letter-spacing: -0.01em;
}

.book-header p {
  margin: 0;
  color: var(--ink-soft);
  font-size: 14px;
  line-height: 1.5;
}

.entry-form {
  padding: 28px 36px;
  border-bottom: 1px solid var(--rule);
}

.field label {
  display: block;
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 6px;
}

.field input {
  width: 100%;
  padding: 11px 12px;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 2px;
  outline: none;
}

.field input:focus {
  border-color: var(--ink-soft);
}

.actions {
  display: flex;
  gap: 12px;
  margin-top: 18px;
}

button.stamp {
  flex: 1;
  padding: 13px 16px;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 15px;
  border: none;
  border-radius: 2px;
  cursor: pointer;
  color: #F5F2E7;
  transition: background 0.15s ease, transform 0.1s ease;
}

button.stamp:active { transform: scale(0.98); }

button.stamp:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-in { background: var(--green); }
.btn-in:hover:not(:disabled) { background: var(--green-hover); }

.btn-out { background: var(--rust); }
.btn-out:hover:not(:disabled) { background: var(--rust-hover); }

.status {
  margin-top: 14px;
  font-size: 13px;
  min-height: 18px;
  color: var(--ink-soft);
}

.status.ok { color: var(--green); }
.status.err { color: var(--rust); }

.log {
  padding: 24px 36px 36px;
}

.log-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.log-title {
  font-size: 13px;
  color: var(--ink-soft);
  margin: 0;
}

.export-btn {
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 2px;
  padding: 6px 12px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.export-btn:hover:not(:disabled) {
  background: var(--paper);
  border-color: var(--ink-soft);
}

.export-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.log-list {
  list-style: none;
  margin: 0;
  padding: 0;
  border-left: 2px solid var(--rule);
}

.log-item {
  position: relative;
  padding: 0 0 16px 20px;
}

.log-item::before {
  content: '';
  position: absolute;
  left: -6px;
  top: 4px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--paper-raised);
  border: 2px solid var(--rule);
}

.log-item.in::before { border-color: var(--green); }
.log-item.out::before { border-color: var(--rust); }

.log-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.log-name {
  font-weight: 500;
  font-size: 14.5px;
}

.log-action {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 0.02em;
}

.log-item.in .log-action { color: var(--green); }
.log-item.out .log-action { color: var(--rust); }

.log-time {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  color: var(--ink-soft);
  margin-top: 2px;
}

.empty {
  color: var(--ink-soft);
  font-size: 14px;
  font-style: italic;
}
</style>
</head>
<body>

<div class="book">
  <div class="book-header">
    <h1>The Ledger</h1>
    <p>Enter your name, then clock in or out. Every entry posts to the private channel with your name and the exact time.</p>
  </div>

  <div class="entry-form">
    <div class="field">
      <label for="name">Your name</label>
      <input id="name" type="text" placeholder="e.g. Sam Rivera" autocomplete="off">
    </div>
    <div class="actions">
      <button class="stamp btn-in" id="btnIn">Clock in</button>
      <button class="stamp btn-out" id="btnOut">Clock out</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="log">
    <div class="log-header">
      <p class="log-title">Recent activity</p>
      <button class="export-btn" id="btnExport">Export CSV</button>
    </div>
    <ul class="log-list" id="logList">
      <li class="empty">No entries yet — be the first to clock in.</li>
    </ul>
  </div>
</div>

<script>
const WEBHOOK_URL = "https://hooks.slack.com/services/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";
const SHEET_URL = "https://script.google.com/a/macros/boundless.com/s/AKfycbwifptAgcDGRuJFX1YIqm9Q_-1tGsEghThHRUZAX9ARAVaju4dFB-RCcztr6VAGq1xc/exec";

const nameInput = document.getElementById('name');
const btnIn = document.getElementById('btnIn');
const btnOut = document.getElementById('btnOut');
const statusEl = document.getElementById('status');
const logList = document.getElementById('logList');

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, {
    weekday: 'short', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit'
  });
}

function renderLog(entries) {
  if (!entries || entries.length === 0) {
    logList.innerHTML = '<li class="empty">No entries yet — be the first to clock in.</li>';
    return;
  }
  const sorted = [...entries].sort((a, b) => new Date(b.time) - new Date(a.time)).slice(0, 25);
  logList.innerHTML = sorted.map(e => `
    <li class="log-item ${e.action}">
      <div class="log-row">
        <span class="log-name">${escapeHtml(e.name)}</span>
        <span class="log-action">${e.action === 'in' ? 'CLOCKED IN' : 'CLOCKED OUT'}</span>
      </div>
      <div class="log-time">${formatTime(e.time)}</div>
    </li>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadLog() {
  try {
    const res = await fetch(SHEET_URL);
    const entries = await res.json();
    renderLog(entries);
    return entries;
  } catch (err) {
    renderLog([]);
    return [];
  }
}

async function saveEntry(entry) {
  await fetch(SHEET_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(entry)
  });
  const entries = await loadLog();
  return entries;
}

function setStatus(message, kind) {
  statusEl.textContent = message;
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}

async function postToSlack(name, action) {
  const label = action === 'in' ? 'clocked in' : 'clocked out';
  const text = `*${name}* ${label} — ${formatTime(new Date().toISOString())}`;
  // Slack's webhook endpoint doesn't send CORS headers back, so the browser
  // blocks JS from reading the response. mode: 'no-cors' still sends the
  // request (Slack still posts the message) — it just means we can't
  // inspect the response, which is fine here.
  await fetch(WEBHOOK_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ text })
  });
}

async function handleClock(action) {
  const name = nameInput.value.trim();
  if (!name) {
    setStatus('Enter your name first.', 'err');
    nameInput.focus();
    return;
  }

  btnIn.disabled = true;
  btnOut.disabled = true;
  setStatus('Sending…');

  const entry = { name, action, time: new Date().toISOString() };

  try {
    await postToSlack(name, action);
    await saveEntry(entry);
    setStatus(`Posted: ${name} ${action === 'in' ? 'clocked in' : 'clocked out'}.`, 'ok');
  } catch (err) {
    setStatus('Could not reach Slack. Please try again.', 'err');
  } finally {
    btnIn.disabled = false;
    btnOut.disabled = false;
  }
}

function toCsv(entries) {
  const header = ['Name', 'Action', 'Timestamp (ISO)', 'Timestamp (local)'];
  const rows = [...entries]
    .sort((a, b) => new Date(a.time) - new Date(b.time))
    .map(e => [
      e.name,
      e.action === 'in' ? 'Clocked in' : 'Clocked out',
      e.time,
      formatTime(e.time)
    ]);
  const escapeCsv = (val) => `"${String(val).replace(/"/g, '""')}"`;
  return [header, ...rows].map(row => row.map(escapeCsv).join(',')).join('\r\n');
}

async function handleExport() {
  const btnExport = document.getElementById('btnExport');
  btnExport.disabled = true;
  const originalLabel = btnExport.textContent;
  btnExport.textContent = 'Preparing…';
  try {
    const entries = await loadLog();
    if (!entries || entries.length === 0) {
      setStatus('No entries to export yet.', 'err');
      return;
    }
    const csv = toCsv(entries);
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `ledger-entries-${dateStr}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    setStatus('Could not export entries. Please try again.', 'err');
  } finally {
    btnExport.disabled = false;
    btnExport.textContent = originalLabel;
  }
}

btnIn.addEventListener('click', () => handleClock('in'));
btnOut.addEventListener('click', () => handleClock('out'));
document.getElementById('btnExport').addEventListener('click', handleExport);

loadLog();
</script>

</body>
</html>
